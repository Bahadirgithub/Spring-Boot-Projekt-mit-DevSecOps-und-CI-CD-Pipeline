# Link auf die Datenbank. Diese Angabe ist später anzupassen für die DBs der Projekte (Ausdruck hinter dem Slash)
spring.datasource.url=jdbc:postgresql://dumbo.inf.h-brs.de/fzore2s

# Username und Password. Diese Angaben sind durch die Projekte anzupassen. Daten bei Hr. Alda per E-Mail anfordern!
spring.datasource.username=fzore2s
spring.datasource.password=fzore2s

# Name des Treibers für das DBMS PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# Angaben zur Aktualisierung des DB-Schemas. Sollte erst mal auf 'none' stehen, weitere Parameter möglich
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=none

vaadin.whitelisted-packages = org.hbrs.se2.project.hellocar.views
kiconnect.api.key=${KICONNECT_API_KEY:}
kiconnect.api.url = https://chat.kiconnect.nrw/api/v1/chat/completions
kiconnect.model = LLAMA 3.1 8B